<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>用户注册</title>
  <style>
    /* 模拟一次 UI 重构：改成无 label 的现代表单设计，
       只保留 placeholder（占位符），id 与功能完全不变。 */
    .field { margin: 12px 0; }
    input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 16px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>用户注册</h1>

  <!--
    v2 改版页：功能与 v1 完全一致，但**去掉了所有 label 元素**。

    这是最典型的改版场景 —— 产品设计从「标签 + 输入框」改成「纯占位符」风格，
    用户看到的交互一点没变，但基于 label 定位的自动化脚本会**全部失效**。

    Explorer 抓 v1 时选的最优定位器是 label，所以拿 v1 的用例来跑这个页面：
      · 主策略 label   → 找不到（label 没了）
      · 备选 placeholder → 能找到（占位符还在）→ 自愈成功

    这个 fixture 就是「自愈能力」的验收基准。
  -->
  <form id="signup-form">
    <div class="field">
      <input id="phone" name="phone" type="tel" placeholder="请输入手机号" required>
    </div>

    <div class="field">
      <input id="code" name="code" type="text" placeholder="请输入验证码" required>
      <button type="button" id="send-code">获取验证码</button>
    </div>

    <div class="field">
      <input id="password" name="password" type="password" placeholder="请设置密码" required>
    </div>

    <div class="field">
      <input id="agree" name="agree" type="checkbox" required>
      <span>我已阅读并同意《用户协议》</span>
    </div>

    <button type="submit" id="submit">注册</button>
  </form>

  <div id="message" role="alert"></div>

  <script>
    var message = document.getElementById('message');

    document.getElementById('send-code').addEventListener('click', function () {
      message.textContent = '验证码已发送';
    });

    document.getElementById('signup-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var phone = document.getElementById('phone').value;
      var code = document.getElementById('code').value;
      var password = document.getElementById('password').value;
      var agree = document.getElementById('agree').checked;

      if (!/^1\d{10}$/.test(phone)) {
        message.textContent = '手机号格式不正确';
        return;
      }
      if (code.length !== 6) {
        message.textContent = '验证码应为 6 位';
        return;
      }
      if (password.length < 8) {
        message.textContent = '密码至少 8 位';
        return;
      }
      if (!agree) {
        message.textContent = '请先阅读并同意用户协议';
        return;
      }
      message.textContent = '注册成功';
    });
  </script>
</body>
</html>
