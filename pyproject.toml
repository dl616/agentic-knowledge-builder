[project]
name = "agentic-knowledge-builder"
version = "0.1.0"
description = "多 Agent 协作、查存混合的企业级知识库构建平台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24.0",
    "trafilatura>=1.8.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
eval = [
    "ragas>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pke"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
